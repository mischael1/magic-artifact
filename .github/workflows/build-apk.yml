name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/kivy-ci:latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install buildozer and dependencies
      run: |
        apt-get update
        apt-get install -y buildozer
        pip install --upgrade pip setuptools wheel cython pyjnius
    
    - name: Accept Android SDK licenses
      run: |
        echo "Accepting Android SDK licenses..."
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Accept all licenses non-interactively
        sdkmanager --licenses < /dev/null 2>&1 || true
        
        echo "Installing Android SDK components..."
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;34.0.0" "ndk;25.1.8937393" --verbose 2>&1 | tail -30
    
    - name: Configure Buildozer environment
      run: |
        mkdir -p ~/.buildozer
        mkdir -p ~/.android
        
        # Buildozer expects SDK in ~/.buildozer/android/platform/android-sdk
        # Create symlink from ANDROID_HOME to buildozer location
        mkdir -p ~/.buildozer/android/platform
        rm -rf ~/.buildozer/android/platform/android-sdk
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Buildozer also expects sdkmanager at tools/bin/sdkmanager
        # Create the expected directory structure
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager || echo "sdkmanager link already exists"
        
        # Set environment variables for buildozer
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        
        # Verify setup
        echo "=== Checking buildozer SDK paths ==="
        ls -la ~/.buildozer/android/platform/android-sdk/build-tools/ | head -5
        ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        ls -la ~/.buildozer/android/platform/android-sdk/platforms/ | head -5
    
    - name: Clean build cache
      run: |
        rm -rf .buildozer
        rm -rf bin
        echo "Cleaned .buildozer and bin directories"
    
    - name: Build APK with verbose output
      run: |
        buildozer -v android debug 2>&1 | tee build.log
        echo "===== BUILD COMPLETE ====="
        echo "Checking for APK..."
        ls -la bin/ 2>/dev/null || echo "bin directory not found"
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Check APK exists
      if: always()
      run: |
        if [ -f "bin/magicartifact-0.1-debug.apk" ]; then
          echo "✅ APK found!"
          ls -lh bin/magicartifact-0.1-debug.apk
        else
          echo "❌ APK NOT found"
          exit 1
        fi
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/
        retention-days: 3
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: magicartifact-apk
        path: bin/magicartifact-0.1-debug.apk
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: bin/magicartifact-0.1-debug.apk
        tag_name: v0.1-${{ github.run_number }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
