name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: '11'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-dev libssl-dev build-essential
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        pip install kivy numpy pyjnius
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 31
        build-tools-version: 34.0.0
        ndk-version: 25.1.8937393
    
    - name: Accept Android licenses
      run: |
        mkdir -p ~/.android
        echo "Accepting Android licenses..."
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "Licenses already accepted"
        
        # Verify build-tools installation
        ls -la $ANDROID_HOME/build-tools/ || echo "Build tools not found"
        ls -la $ANDROID_HOME/platforms/ || echo "Platforms not found"
    
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
        echo "Build finished. Checking for APK..."
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
    
    - name: Check APK exists
      run: |
        if [ -f "bin/magicartifact-0.1-debug.apk" ]; then
          echo "APK found!"
          ls -lh bin/magicartifact-0.1-debug.apk
        else
          echo "APK NOT found - checking for alternatives..."
          find . -name "*.apk" -type f
          echo "BUILD FAILED - APK not created"
          cat build.log | tail -100
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: magicartifact-apk
        path: bin/magicartifact-0.1-debug.apk
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: bin/magicartifact-0.1-debug.apk
        tag_name: v0.1-${{ github.run_number }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
