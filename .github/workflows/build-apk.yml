name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install build-tools for buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          cp -r /usr/local/lib/android/sdk/build-tools/* ~/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || true
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/platforms
          cp -r /usr/local/lib/android/sdk/platforms/* ~/.buildozer/android/platform/android-sdk/platforms/ 2>/dev/null || true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython
      
      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          timeout 3600 buildozer android debug 2>&1 | tee build.log || true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magicartifact-apk
          path: bin/*.apk
          retention-days: 30
      
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
