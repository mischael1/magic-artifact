name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        run: |
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          
          # Download Android SDK Command-line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          
          # Accept licenses
          yes | ./cmdline-tools/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install SDK components
          yes | ./cmdline-tools/bin/sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "build-tools;36.1.0" \
            "ndk;25.1.8937393" 2>/dev/null || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython
      
      - name: Install additional dependencies
        run: |
          sudo apt-get install -y ant gradle
          
      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393
        run: |
          cd $GITHUB_WORKSPACE
          timeout 3600 buildozer android debug 2>&1 | tee build.log || true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magicartifact-apk
          path: bin/*.apk
          retention-days: 30
      
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
