name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: '11'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        pip install kivy numpy
    
    - name: Accept Android licenses
      run: |
        mkdir -p ~/.android
        echo -e "\n\nn\n" | sdkmanager --licenses || true
    
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
        echo "Build finished. Checking for APK..."
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
    
    - name: Check APK exists
      run: |
        if [ -f "bin/magicartifact-0.1-debug.apk" ]; then
          echo "APK found!"
          ls -lh bin/magicartifact-0.1-debug.apk
        else
          echo "APK NOT found - checking for alternatives..."
          find . -name "*.apk" -type f
          echo "BUILD FAILED - APK not created"
          cat build.log | tail -100
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: magicartifact-apk
        path: bin/magicartifact-0.1-debug.apk
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: bin/magicartifact-0.1-debug.apk
        tag_name: v0.1-${{ github.run_number }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
