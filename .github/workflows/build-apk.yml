name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-dev libssl-dev build-essential ant
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython
        pip install kivy numpy pyjnius
    
    - name: Configure Buildozer environment
      run: |
        mkdir -p ~/.buildozer
        mkdir -p ~/.android
        
        # Create android config if needed
        if [ ! -f ~/.android/repositories.cfg ]; then
          echo "### Android repositories for gradle ### " > ~/.android/repositories.cfg
          echo "count=0" >> ~/.android/repositories.cfg
        fi
    
    - name: Accept Android SDK licenses
      run: |
        echo "Accepting Android SDK licenses..."
        yes | sdkmanager --licenses 2>/dev/null || true
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;34.0.0" "ndk;25.1.8937393" --verbose 2>&1 | grep -E "(Installing|done)"
    
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
        echo "Build finished. Checking for APK..."
        ls -la bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
    
    - name: Check APK exists
      run: |
        if [ -f "bin/magicartifact-0.1-debug.apk" ]; then
          echo "APK found!"
          ls -lh bin/magicartifact-0.1-debug.apk
        else
          echo "APK NOT found - checking for alternatives..."
          find . -name "*.apk" -type f
          echo "BUILD FAILED - APK not created"
          cat build.log | tail -100
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: magicartifact-apk
        path: bin/magicartifact-0.1-debug.apk
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: bin/magicartifact-0.1-debug.apk
        tag_name: v0.1-${{ github.run_number }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
